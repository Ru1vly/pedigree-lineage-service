{{- if .Values.flux.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "pedigree-lineage.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pedigree-lineage.labels" . | nindent 4 }}
spec:
  interval: 5m
  chart:
    spec:
      chart: pedigree-lineage
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: edevlet-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    worker:
      useArgoRollout: false
    keda:
      enabled: true
      minReplicaCount: {{ .Values.keda.minReplicaCount }}
      maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
      lagThreshold: {{ .Values.keda.lagThreshold }}
{{- end }}
