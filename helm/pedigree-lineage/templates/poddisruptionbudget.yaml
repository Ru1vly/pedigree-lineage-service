{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pedigree-lineage.fullname" . }}-worker-pdb
  labels:
    {{- include "pedigree-lineage.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "pedigree-lineage.workerSelectorLabels" . | nindent 6 }}
{{- end }}
