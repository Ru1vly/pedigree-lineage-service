{{- if not .Values.kafka.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.kafka.secretName }}
  labels:
    {{- include "pedigree-lineage.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The lowercase keys are read by KEDA's TriggerAuthentication (keda-triggerauth.yaml); the
  # SPRING_ ones are projected into the pods by envFrom.
  sasl: {{ .Values.kafka.saslMechanism | quote }}
  tls: {{ .Values.kafka.tls | quote }}
  username: {{ .Values.kafka.username | quote }}
  password: {{ .Values.kafka.password | quote }}
  SPRING_KAFKA_USERNAME: {{ .Values.kafka.username | quote }}
  SPRING_KAFKA_PASSWORD: {{ .Values.kafka.password | quote }}
{{- end }}
---
{{- if not .Values.postgresql.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.secretName }}
  labels:
    {{- include "pedigree-lineage.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgresql.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgresql.password | quote }}
{{- end }}
---
{{- if not .Values.redis.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.redis.secretName }}
  labels:
    {{- include "pedigree-lineage.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_REDIS_PASSWORD: ""
{{- end }}
---
{{- if not .Values.security.existingAppSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.security.appSecretsName }}
  labels:
    {{- include "pedigree-lineage.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_HMAC_SECRET: {{ .Values.security.jwt.secret | quote }}
  TCKN_ENCRYPTION_MASTER_KEY: {{ .Values.security.encryption.masterKey | quote }}
{{- end }}
---
{{- if and .Values.security.vault.enabled (not .Values.security.vault.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.security.vault.secretName }}
  labels:
    {{- include "pedigree-lineage.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_CLOUD_VAULT_TOKEN: {{ .Values.security.vault.token | quote }}
{{- end }}
