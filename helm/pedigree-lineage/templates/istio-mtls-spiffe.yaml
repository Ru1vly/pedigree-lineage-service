{{- if .Values.mesh.enabled }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ include "pedigree-lineage.fullname" . }}-peer-auth
  labels:
    {{- include "pedigree-lineage.labels" . | nindent 4 }}
spec:
  mtls:
    mode: {{ .Values.mesh.mtls.mode | default "STRICT" }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "pedigree-lineage.fullname" . }}-authz-policy
  labels:
    {{- include "pedigree-lineage.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pedigree-lineage.name" . }}
  action: ALLOW
  rules:
    - from:
        - source:
            # Istio matches SOURCE_PRINCIPAL in scheme-less form ("<trust-domain>/ns/.../sa/...");
            # trustDomain is stored as a full "spiffe://..." URI (it's also used verbatim in the
            # spiffe.io/spiffe-id pod annotation, which does expect the scheme), so the scheme is
            # stripped here specifically for the principals list, or every rule below would fail
            # to match anything and this policy would silently allow no traffic at all.
            principals:
              - "{{ trimPrefix "spiffe://" (.Values.mesh.spiffe.trustDomain | default "cluster.local") }}/ns/{{ .Release.Namespace }}/sa/{{ include "pedigree-lineage.serviceAccountName" . }}"
              - "{{ trimPrefix "spiffe://" (.Values.mesh.spiffe.trustDomain | default "cluster.local") }}/ns/istio-system/sa/istio-ingressgateway-service-account"
{{- end }}
