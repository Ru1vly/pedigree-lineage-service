name: CI

# Every gate below existed as a command someone could run by hand and, in practice, did not.
# The suite had never been run against the tree as committed, helm lint had never been executed,
# and the Dockerfile's build stage had never succeeded once. Running them on every push is the
# only thing that keeps that from being true again.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, checkstyle, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # `verify` runs the full chain: checkstyle:check (validate), the test suite, the JaCoCo
      # report, and jacoco:check against the coverage floor in pom.xml. GitHub's ubuntu runners
      # have a working Docker daemon, so the Testcontainers tests - the Flyway migration test and
      # the Debezium CDC path - really execute here rather than skipping.
      - name: Build and verify
        run: mvn -B --no-transfer-progress verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          report=target/site/jacoco/jacoco.csv
          if [[ -f "$report" ]]; then
            awk -F, 'NR>1 {missed+=$8; covered+=$9}
                     END {printf "Line coverage: %d/%d (%.2f%%)\n",
                          covered, covered+missed, 100*covered/(covered+missed)}' "$report" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  manifests:
    name: Helm lint, template render, manifest syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # The ArgoCD, Flux, Flagger and Argo Rollouts manifests are a large part of what this
      # repository claims to deliver, and nothing had ever rendered them.
      - name: Validate manifests
        run: bash scripts/validate_manifests.sh

  docker-image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `docker compose up --build` is the first command in the README. Its build stage ran
      # `./mvnw package || mvn package` in an image that has neither, against a repository with no
      # wrapper committed - so both halves failed and the build died. This job is the reason that
      # cannot silently come back.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pedigree-lineage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
