spring:
  application:
    name: pedigree-lineage-service-test

  datasource:
    url: jdbc:h2:mem:lineage_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Flyway is off in THIS profile only, and that is now a deliberate split rather than a gap.
  # These are the fast unit slices: H2, no containers, Hibernate builds the schema. The migrations
  # cannot run here anyway - they are PostgreSQL DDL, and production runs them with
  # ddl-auto: validate, which is a different contract from ddl-auto: update on H2.
  #
  # V1-V4 are exercised for real by FlywaySchemaMigrationTest, which starts PostgreSQL via
  # Testcontainers, applies every migration, and boots under ddl-auto: validate - production's
  # actual contract. Before that test existed the migrations were never executed by `mvn test`
  # at all, so a migration that failed to apply, or that drifted from the entity mappings, would
  # first have been discovered on a deployment.
  flyway:
    enabled: false

  cloud:
    vault:
      enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.cloud.vault.config.VaultAutoConfiguration

  main:
    allow-bean-definition-overriding: true

app:
  kafka:
    listener:
      # KafkaConfig builds its consumer/producer factories directly from spring.kafka.* properties
      # (not from KafkaAutoConfiguration's beans), so those factories exist fine here regardless -
      # this only stops the listener container's background consumer thread from repeatedly
      # retrying against a Kafka broker that was never started in this H2/mocked-Redis profile.
      auto-startup: false
  security:
    jwt:
      secret: test-only-hmac-secret-not-for-production-use-32-bytes-minimum
    vault:
      enabled: false
    encryption:
      master-key: edevlet-tckn-test-encryption-key-2026

logging:
  level:
    root: INFO
    com.edevlet.lineage: DEBUG
