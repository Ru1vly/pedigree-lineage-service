server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: pedigree-lineage-service
  lifecycle:
    timeout-per-shutdown-phase: 60s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lineagedb}
    username: ${SPRING_DATASOURCE_USERNAME:lineageuser}
    password: ${SPRING_DATASOURCE_PASSWORD:lineagepass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:lineage-worker-group}
      auto-offset-reset: earliest
    listener:
      concurrency: ${SPRING_KAFKA_LISTENER_CONCURRENCY:3}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

  # NOTE: there is deliberately no spring.security.oauth2.resourceserver.* block here. This service
  # builds its own JwtDecoder in SecurityConfig, which Boot's resource-server auto-configuration
  # backs off from (@ConditionalOnMissingBean), so any issuer-uri set under that prefix is read by
  # nobody and silently changes nothing. It used to be set, pointing at a Keycloak realm, which
  # read as the configured identity provider while the service was actually validating tokens with
  # the shared HS256 secret. The property that works is app.security.jwt.issuer-uri, below.

  cloud:
    vault:
      enabled: ${SPRING_CLOUD_VAULT_ENABLED:true}
      host: ${SPRING_CLOUD_VAULT_HOST:localhost}
      port: ${SPRING_CLOUD_VAULT_PORT:8200}
      scheme: ${SPRING_CLOUD_VAULT_SCHEME:http}
      authentication: TOKEN
      token: ${SPRING_CLOUD_VAULT_TOKEN:root}
      fail-fast: false
      config:
        lifecycle:
          enabled: true
          min-ttl: 1h
          time-to-live: 1h
      database:
        enabled: true
        role: pedigree-db-role
        backend: database

app:
  ratelimit:
    # Per-user ingress limit on POST /api/v1/lineage/queries. Counted in Redis by
    # RateLimitingFilter, so this is the limit for the whole deployment - it does not multiply by
    # the replica count the way the previous in-JVM Resilience4j registry did.
    lineage-ingress:
      limit-for-period: ${APP_RATELIMIT_LIMIT_FOR_PERIOD:10}
      refresh-period: ${APP_RATELIMIT_REFRESH_PERIOD:1m}
  kafka:
    listener:
      # Disabled only under the "test" profile (pure H2/mocked-Redis unit tests) so the listener
      # container doesn't spin up a background consumer thread retrying against a Kafka broker
      # that was never started - see application-test.yml.
      auto-startup: ${APP_KAFKA_LISTENER_AUTO_STARTUP:true}
  security:
    # Believe X-Forwarded-For / X-Real-IP when recording a caller's origin in the audit trail.
    # Off by default: those headers are client-supplied, so trusting them on a directly exposed
    # deployment lets a caller choose what the compliance trail records about them. Behind the
    # nginx ingress in helm/, getRemoteAddr() is the ingress pod and the real client is only in
    # the header, so that deployment sets this true. See ClientOriginEnrichmentFilter.
    trust-forwarded-headers: ${APP_SECURITY_TRUST_FORWARDED_HEADERS:false}
    # Every default below is deliberately obvious/insecure so a fresh clone still boots for
    # local development. SecretsConfigurationGuard refuses to start under the "production"
    # Spring profile if any of these are left unchanged — see values-prod.yaml for the
    # per-environment overrides that must be supplied instead.
    jwt:
      # Shared HS256 secret. Development only - it both signs (DevTokenController) and verifies,
      # so whoever holds it can forge any identity or role. Used only when neither jwk-set-uri nor
      # issuer-uri below is set; SecretsConfigurationGuard refuses to start under the "production"
      # profile in that case.
      secret: ${JWT_HMAC_SECRET:local-dev-only-insecure-default-CHANGE-ME-2026-not-for-production-use}
      # Point either of these at the real OIDC provider to switch to asymmetric validation against
      # its published signing keys. jwk-set-uri wins; issuer-uri alone uses OIDC discovery. Both
      # additionally validate the iss claim, and audience below validates aud when set.
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      issuer-uri: ${JWT_ISSUER_URI:}
      audience: ${JWT_AUDIENCE:}
    vault:
      enabled: ${VAULT_TRANSIT_ENABLED:true}
    encryption:
      # Secret backing the active key, and the only key that can read rows still in the legacy
      # enc:v1:gcm: format. VaultTransitTcknEncryptionService has NO hardcoded fallback for this:
      # if neither this nor keys.<active-key-id> is set, startup fails rather than encrypting
      # citizen national IDs under a key committed to the source tree.
      master-key: ${TCKN_ENCRYPTION_MASTER_KEY:local-dev-only-insecure-default-CHANGE-ME-2026-not-for-production-use-tckn-key}
      # Which key new ciphertexts are written under. Rotation: add the new secret under
      # keys.<new-id>, point this at it, deploy, and leave the old entry in place until every row
      # encrypted under it has been rewritten - a key that stored data still references must not be
      # removed. Ciphertext carries its key id (enc:v2:<keyId>:...), which is what makes this work
      # at all; the old single-key scheme named no key, so changing it orphaned every historical row.
      active-key-id: ${TCKN_ENCRYPTION_ACTIVE_KEY_ID:primary}
      # keys:
      #   primary: ${TCKN_ENCRYPTION_MASTER_KEY}
      #   2026-q3: ${TCKN_ENCRYPTION_KEY_2026_Q3}
      kdf:
        # PBKDF2-HMAC-SHA256 replaces the previous SHA-256(passphrase), which was unsalted and
        # uniterated. Derivation runs once per key at startup, not per row, so the iteration count
        # costs boot time only. The salt is not secret, but it must be set per environment and must
        # never change once rows exist - changing it re-derives every key.
        salt: ${TCKN_ENCRYPTION_KDF_SALT:pedigree-lineage-tckn-kdf-salt}
        iterations: ${TCKN_ENCRYPTION_KDF_ITERATIONS:210000}
  sse:
    # Bounds on the progress-stream endpoint. Each open stream is a repeating poll on a shared,
    # fixed-size scheduler, so concurrency has to be capped somewhere: either the number of streams
    # is limited explicitly, or the advertised poll interval silently stretches under load. An
    # explicit 503 is the honest version. See LineageQueryController.
    max-concurrent-streams: ${APP_SSE_MAX_CONCURRENT_STREAMS:200}
    scheduler-pool-size: ${APP_SSE_SCHEDULER_POOL_SIZE:8}
    poll-interval: ${APP_SSE_POLL_INTERVAL:2s}

management:
  endpoints:
    web:
      exposure:
        # env and loggers are deliberately NOT exposed by default: /env leaks resolved
        # configuration (secrets included) and /loggers accepts POSTs that mutate log levels at
        # runtime. SecurityConfig gates /actuator/** behind ROLE_ADMIN as the primary control;
        # keeping them off the exposure list is the second layer. Opt in per-environment via
        # MANAGEMENT_ENDPOINTS_EXPOSURE only where an operator-only network path exists.
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    instances:
      legacyCensusBackend:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
  # LegacyCensusGraphClientImpl carries @Retry(name = "legacyCensusBackend") and this block did not
  # exist, so the annotation ran on Resilience4j's defaults: 3 attempts, 500ms flat wait, retrying
  # every exception. Multiplied by the pipeline's own re-queue loop that is a lot of load aimed at a
  # backend that is already failing - see the retry-budget comment on LegacyCensusGraphClientImpl
  # for the arithmetic. Configured explicitly now, and deliberately shallow: the pipeline layer
  # above already retries, so this one only exists to absorb a single transient blip.
  retry:
    instances:
      legacyCensusBackend:
        maxAttempts: ${RESILIENCE_CENSUS_RETRY_MAX_ATTEMPTS:2}
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        # Retrying an open circuit is pure waste: the breaker is refusing the call precisely
        # because the backend is known to be failing, and every retry burns a permit's worth of
        # latency to be refused again. Fail fast to the pipeline layer, which applies its own
        # backoff before the next attempt.
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException

logging:
  level:
    root: INFO
    com.edevlet.lineage: DEBUG
    org.springframework.security: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO

