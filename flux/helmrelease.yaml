apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pedigree-lineage
  namespace: pedigree-lineage
spec:
  interval: 10m
  chart:
    spec:
      chart: pedigree-lineage
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: edevlet-charts
        namespace: flux-system
      interval: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      environment: production
    worker:
      useArgoRollout: false
    keda:
      enabled: true
      minReplicaCount: 2
      maxReplicaCount: 12
      lagThreshold: 1000
      pollingInterval: 5
      cooldownPeriod: 300
    flux:
      enabled: true
      flagger:
        enabled: true
